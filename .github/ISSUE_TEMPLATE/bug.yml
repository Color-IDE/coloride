name: Bug
description: Something in the local IDE does not work as described.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: def1a23 or a local build
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove tokens, keys and private project paths.
