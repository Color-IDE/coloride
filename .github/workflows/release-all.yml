name: Release Desktop

on:
  pull_request:
    paths:
      - '.github/workflows/release-*.yml'
      - 'tooling/build/**'
      - 'tooling/release/**'
      - 'client/desktop/**'
      - 'client/ide/public/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'THIRD_PARTY_NOTICES.md'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag or ref to build (empty = selected ref, version from package.json)'
        required: false
        default: ''
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''
      windows_only:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - id: meta
        env:
          REQUESTED_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./client/desktop/package.json').version")
          TAG="v${VERSION}"
          if [[ "$REQUESTED_REF" =~ ^v[0-9] && "$REQUESTED_REF" != "$TAG" ]]; then
            echo 'Release tag must match the desktop package version' >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  mac:
    if: ${{ !inputs.windows_only }}
    needs: meta
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - name: Build Python sidecar
        run: bash tooling/build/build-sidecar.sh --out client/desktop/resources/sidecar
      - name: Build macOS arm64 installers
        id: package
        working-directory: client/desktop
        env:
          CSC_LINK: ${{ github.event_name != 'pull_request' && secrets.MACOS_DEVELOPER_ID_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.MACOS_DEVELOPER_ID_P12_PASSWORD || '' }}
          APPLE_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          set -euo pipefail
          if [ -n "$CSC_LINK" ] && [ -n "$CSC_KEY_PASSWORD" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            pnpm exec electron-builder --mac dmg zip --arm64 --publish never -c.mac.notarize=true -c.forceCodeSigning=true
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          elif [ -n "$CSC_LINK$CSC_KEY_PASSWORD$APPLE_ID$APPLE_APP_SPECIFIC_PASSWORD$APPLE_TEAM_ID" ]; then
            echo 'Incomplete signing/notarization credentials; refusing to publish an unsigned fallback.' >&2
            exit 1
          else
            CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder --mac dmg zip --arm64 --publish never -c.mac.identity=null -c.mac.notarize=false
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo 'Community build: unsigned and not notarized.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify signature and notarization
        if: steps.package.outputs.signed == 'true'
        working-directory: client/desktop
        run: |
          set -euo pipefail
          APP_PATH=$(find release -type d -name 'Coloride.app' -print -quit)
          test -n "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          spctl --assess --type execute "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: |
            client/desktop/release/*.dmg
            client/desktop/release/*.zip
            client/desktop/release/*.blockmap
            client/desktop/release/latest-mac.yml
          if-no-files-found: error

  windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - name: Build Python sidecar
        shell: pwsh
        run: ./tooling/build/build-sidecar.ps1 -OutDir client/desktop/resources/sidecar
      - name: Build Windows installer
        working-directory: client/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            client/desktop/release/*-setup.exe
            client/desktop/release/*.blockmap
            client/desktop/release/latest.yml
          if-no-files-found: error

  publish:
    needs: [meta, mac, windows]
    if: ${{ github.event_name != 'pull_request' && !cancelled() && needs.windows.result == 'success' && (needs.mac.result == 'success' || needs.mac.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ship
          merge-multiple: true
      - name: Publish draft release in this repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
          SHA: ${{ needs.meta.outputs.sha }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$SHA" --draft --title "Coloride $TAG" \
              --notes 'Open-source desktop builds. macOS community builds may be unsigned and not notarized; Windows installers are unsigned. Review workflow signing checks before distribution. Windows support is experimental.'
          fi
          gh release upload "$TAG" ship/* --clobber
