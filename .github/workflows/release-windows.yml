# Manual Windows-only build. Tag pushes use release-all.yml to avoid duplicate releases.
name: Release Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag or ref to build (empty = selected ref)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/release-all.yml
    with:
      tag: ${{ inputs.tag }}
      windows_only: true
    secrets: inherit
