[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "coloride-desktop-backend"
version = "0.1.0"
description = "Execution host for the Coloride IDE: files, terminals, language servers and agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agent-client-protocol==0.12.1",
  "asyncssh>=2.14,<3.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "keyring>=25,<26",
  "pillow>=10,<12",
  "pydantic>=2.8,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "websockets>=12,<15",
]

[project.optional-dependencies]
search-semantic = ["fastembed>=0.8,<0.9"]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
coloride-desktop-backend = "coloride_desktop.main:main"
coloride-sidecar = "coloride_desktop.sidecar:main"

[tool.hatch.build.targets.wheel]
packages = ["src/coloride_desktop"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
