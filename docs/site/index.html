<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coloride</title>
    <meta name="description" content="A local desktop IDE for macOS. Files, terminal and browser stay on your machine." />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #171717;
        color: #f4f4f5;
        font: 16px/1.5 ui-sans-serif, system-ui, sans-serif;
      }
      main { width: min(640px, calc(100% - 48px)); }
      h1 { margin: 0 0 12px; font-size: 42px; letter-spacing: -0.04em; }
      p { margin: 0 0 28px; color: #a1a1aa; }
      a {
        color: #171717;
        background: #f4f4f5;
        text-decoration: none;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Coloride</h1>
      <p>A local desktop IDE. Files, terminal and browser stay on your machine.</p>
      <a href="https://github.com/Color-IDE/coloride">Source on GitHub</a>
    </main>
  </body>
</html>
