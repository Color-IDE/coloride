                  default: true
                  description: Set false to save a provider without selecting it for agent requests.
                provider:
                  type: string
                  description: Registered built-in provider ID or custom:name.
                model:
                  type: string
                apiKey:
                  type: string
                  writeOnly: true
                baseUrl:
                  type: string
