openapi: 3.1.0
info:
  title: Coloride Local API
  version: 2.2.0
  description: REST and WebSocket contract between the React UI and local FastAPI backend.
servers:
  - url: http://127.0.0.1:{port}
    variables:
      port:
        default: "8788"
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    ExternalAgentHistoryEntry:
      type: object
      required: [session, firstMessage, preview, snippet, matches]
      properties:
        session: { $ref: "#/components/schemas/ExternalAgentSession" }
        firstMessage: { type: string }
        preview: { type: string }
        snippet: { type: string }
        matches: { type: boolean }
    ExternalAgentAccountUsage:
      type: object
      required: [agentId, name, status, windows, updatedAt]
      properties:
        agentId: { type: string }
        name: { type: string }
        status: { type: string, enum: [available, unavailable, unsupported] }
        updatedAt: { type: [string, "null"] }
        windows:
          type: array
          items:
            type: object
            required: [usedPercent, windowMinutes, resetsAt]
            properties:
              usedPercent: { type: number, minimum: 0, maximum: 100 }
              windowMinutes: { type: number, exclusiveMinimum: 0 }
              resetsAt: { type: [number, "null"] }
    ErrorPayload:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
    ConnStats:
      type: object
      required: [rttMs, upBps, downBps, certTtlSec]
      properties:
        rttMs:
          type: integer
        upBps:
          type: integer
        downBps:
          type: integer
        certTtlSec:
          type: integer
        server:
          type: object
          properties:
            cpu:
              type: number
            memPct:
              type: number
            diskPct:
              type: number
    ExternalAgentDistributionKind:
      type: string
      enum: [npx, uvx, binary]
    ExternalAgentInstallationStatus:
      type: string
      enum: [installed, installing, failed, missing-runtime]
    ExternalAgentConnectionPhase:
      type: string
      enum: [installed, starting, needs-login, authenticating, ready, failed, closed, unsupported]
    ExternalAgentRegistryEntry:
      type: object
      required: [id, name, version, description, distributionKind, installed]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
        description: { type: string }
        repository: { type: string, nullable: true }
        website: { type: string, nullable: true }
        license: { type: string, nullable: true }
        licenseUrl: { type: string, nullable: true }
        icon: { type: string, nullable: true }
        distributionKind: { $ref: "#/components/schemas/ExternalAgentDistributionKind" }
        packageSpec: { type: string, nullable: true }
        installed: { type: boolean }
        installedVersion: { type: string, nullable: true }
    ExternalAgentInstallation:
      type: object
      required: [id, agentId, name, version, distribution, status]
      properties:
        id: { type: string }
        agentId: { type: string }
        name: { type: string }
        version: { type: string }
        distribution: { $ref: "#/components/schemas/ExternalAgentDistributionKind" }
        status: { $ref: "#/components/schemas/ExternalAgentInstallationStatus" }
        error: { type: string, nullable: true }
        installedAt: { type: string, nullable: true }
        packageSpec: { type: string, nullable: true }
        executable: { type: string, nullable: true }
    ExternalAgentAuthMethod:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        type: { type: string, enum: [agent, terminal, env] }
    ExternalAgentSession:
      type: object
      required: [id, agentId, installationVersion, acpSessionId, workspacePath, executionTarget, installationId, title, phase, turn, processId, supportsLoad, authMethods, updatedAt]
      properties:
        id: { type: string, description: Coloride session id }
        agentId: { type: string, description: Registry id, for example codex-acp }
        installationVersion: { type: string }
        acpSessionId: { type: string, nullable: true }
        workspacePath: { type: string }
        executionTarget: { type: string, enum: [local] }
        installationId: { type: string }
        title: { type: string }
        phase: { $ref: "#/components/schemas/ExternalAgentConnectionPhase" }
        turn: { type: string, enum: [idle, running, cancelling] }
        processId: { type: string, nullable: true }
        supportsLoad: { type: boolean }
        supportsImages: { type: boolean }
        authMethods:
          type: array
          items: { $ref: "#/components/schemas/ExternalAgentAuthMethod" }
        configOptions:
          type: array
          items: { $ref: "#/components/schemas/ExternalAgentConfigOption" }
        error: { type: string, nullable: true }
        updatedAt: { type: string }
    ExternalAgentConfigChoice:
      type: object
      required: [value, name]
      properties:
        value: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        group: { type: string, nullable: true }
        groupName: { type: string, nullable: true }
    ExternalAgentConfigOption:
      type: object
      required: [id, name, category, type, currentValue, options]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        category: { type: string, nullable: true }
        type: { type: string, enum: [select, boolean] }
        currentValue: {}
        options:
          type: array
          items: { $ref: "#/components/schemas/ExternalAgentConfigChoice" }
    ExternalAgentConfig:
      type: object
      required: [sessionId, options, pending]
      properties:
        sessionId: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/ExternalAgentConfigOption" }
        pending:
          type: object
          additionalProperties: true
    ExternalAgentEvent:
      type: object
      required: [sessionId, sequence, update, createdAt]
      properties:
        sessionId: { type: string }
        sequence: { type: integer }
        update:
          type: object
          required: [sessionUpdate]
          additionalProperties: true
        createdAt: { type: string }
    ExternalAgentPermissionOption:
      type: object
      required: [optionId, name, kind]
      properties:
        optionId: { type: string }
        name: { type: string }
        kind: { type: string }
    ExternalAgentPermissionRequest:
      type: object
      required: [requestId, sessionId, options]
      properties:
        requestId: { type: string }
        sessionId: { type: string }
        toolCallId: { type: string, nullable: true }
        title: { type: string, nullable: true }
        kind: { type: string, nullable: true }
        options:
          type: array
          items: { $ref: "#/components/schemas/ExternalAgentPermissionOption" }
    ExternalAgentImage:
      type: object
      required: [data, mimeType, name]
      properties:
        data: { type: string, format: byte, maxLength: 14000000 }
        mimeType: { type: string, enum: [image/png, image/jpeg, image/webp, image/gif] }
        name: { type: string, maxLength: 255 }
    ExternalAgentPromptAcceptance:
      type: object
      required: [accepted, sessionId, turnId]
      properties:
        accepted: { type: boolean, const: true }
        sessionId: { type: string }
        turnId: { type: string }
    AgentInfo:
      type: object
      required: [id, name, version, installed, needsKey, supported]
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        installed:
          type: boolean
        needsKey:
          type: boolean
        supported:
          type: boolean
    AgentDiscoveredModel:
      type: object
      required: [id, label]
      properties:
        capabilities:
          type: object
          nullable: true
          properties:
            tools:
              type: boolean
            streaming:
              type: boolean
            images:
              type: boolean
            reasoning:
              type: boolean
            encrypted_reasoning:
              type: boolean
            context_tokens:
              type: integer
            context_characters:
              type: integer
            source:
              type: string
              enum: [unknown, declared, catalog, reviewed]
        id:
          type: string
        label:
          type: string
    AgentProviderDefinition:
      type: object
      required: [id, label, protocol, baseUrl, requiresKey, builtin, showInSettings]
      properties:
        id:
          type: string
        label:
          type: string
        protocol:
          type: string
          enum: [responses, chat-completions, gemini]
        baseUrl:
          type: string
          format: uri
        requiresKey:
          type: boolean
        builtin:
          type: boolean
        showInSettings:
          type: boolean
    AgentProviderConfiguration:
      type: object
      required: [provider, model, baseUrl, configured, credentialSource, active]
      properties:
        label:
          type: string
        protocol:
          type: string
        requiresKey:
          type: boolean
        showInSettings:
          type: boolean
        availableModels:
          type: array
          items:
            $ref: '#/components/schemas/AgentDiscoveredModel'
        provider:
          type: string
          description: Registered built-in provider ID or custom:name.
        model:
          type: string
        baseUrl:
          type: string
          format: uri
        configured:
          type: boolean
        credentialSource:
          type: string
          enum: [environment, keychain, local, none]
        active:
          type: boolean
    AgentProviderConfig:
      type: object
      required: [provider, model, baseUrl, configured, credentialSource, capabilities]
      properties:
        providers:
          type: array
          description: Included when includeProviders is true or an inactive configuration is saved; contains no keys.
          items:
            $ref: "#/components/schemas/AgentProviderConfiguration"
        provider:
          type: string
          description: Registered built-in provider ID or custom:name.
        model:
          type: string
        baseUrl:
          type: string
          format: uri
        configured:
          type: boolean
        credentialSource:
          type: string
          enum: [environment, keychain, coloride, local, none]
        managedLlm:
          type: boolean
        capabilities:
          type: object
          required: [streaming, encryptedReasoning, maxContextCharacters, maxContextTokens, maxRetries]
          properties:
            tools:
              type: boolean
            images:
              type: boolean
            reasoning:
              type: boolean
            streaming:
              type: boolean
            encryptedReasoning:
              type: boolean
            maxContextCharacters:
              type: integer
            maxContextTokens:
              type: integer
            maxRetries:
              type: integer
    AgentMode:
      type: string
      enum: [ask, plan, debug, act]
    AgentSessionSummary:
      type: object
      required: [sessionId, agent, task, cwd, mode, accessLevel, state, spentUsd, startedAt, updatedAt]
      properties:
        sessionId:
          type: string
        agent:
          type: string
        task:
          type: string
        cwd:
          type: string
        mode:
          $ref: "#/components/schemas/AgentMode"
        accessLevel:
          type: string
          enum: [request, agent, full]
        state:
          type: string
          enum: [starting, idle, running, waiting-approval, stopped, failed]
        model:
          type: [string, "null"]
        spentUsd:
          type: number
        budgetUsd:
          type: [number, "null"]
        startedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastError:
          type: [string, "null"]
    AgentEvent:
      type: object
      required: [id, sessionId, sequence, type, data, createdAt]
      properties:
        id:
          type: string
        sessionId:
          type: string
        sequence:
          type: integer
        type:
          type: string
          enum: [user_message, activity, text, text_delta, text_replace, reasoning_delta, plan_delta, plan_updated, tool_call, tool_output, tool_result, diff, diff_preview, context_compacted, context_snapshot, checkpoint_created, checkpoint_restored, approval_required, approval_resolved, mode_changed, reasoning_changed, cloud_session_refreshing, workspace_changed, status, usage, error, done]
        data:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    AgentApproval:
      type: object
      required: [id, sessionId, kind, title, details, state, createdAt]
      properties:
        id:
          type: string
        sessionId:
          type: string
        kind:
          type: string
        title:
          type: string
        details:
          type: object
          additionalProperties: true
        state:
          type: string
          enum: [pending, approved, declined, cancelled, expired]
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: [string, "null"]
          format: date-time
    AgentTool:
      type: object
      required: [id, name, description, risk, modes]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        risk:
          type: string
          enum: [read, write, execute]
        modes:
          type: array
          items:
            $ref: "#/components/schemas/AgentMode"
    AgentMCPServer:
      type: object
      required: [id, name, url, enabled, headerEnv, status, error]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
        enabled:
          type: boolean
        headerEnv:
          type: object
          additionalProperties:
            type: string
        status:
          type: string
          enum: [configured, ready, disabled, error]
        error:
          type: string
    AgentMetrics:
      type: object
      required: [private, records, turns, completedTurns, failedTurns, toolCalls, toolFailures, checkpoints, compactions, inputTokens, outputTokens, averageTurnMs, topTools]
      properties:
        private:
          type: boolean
          const: true
        records:
          type: integer
        turns:
          type: integer
        completedTurns:
          type: integer
        failedTurns:
          type: integer
        toolCalls:
          type: integer
        toolFailures:
          type: integer
        checkpoints:
          type: integer
        compactions:
          type: integer
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        averageTurnMs:
          type: integer
        topTools:
          type: array
          items:
            type: object
            required: [name, calls]
            properties:
              name:
                type: string
              calls:
                type: integer
    AgentCheckpoint:
      type: object
      required: [id, sessionId, tool, callId, cwd, createdAt, paths]
      properties:
        id:
          type: string
        sessionId:
          type: string
        tool:
          type: string
        callId:
          type: string
        cwd:
          type: string
        createdAt:
          type: string
          format: date-time
        paths:
          type: array
          items:
            type: object
            required: [path, kind]
            properties:
              path:
                type: string
              kind:
                type: string
    AgentEvaluationCheck:
      type: object
      required: [id, label, passed, detail]
      properties:
        id:
          type: string
        label:
          type: string
        passed:
          type: boolean
        detail:
          type: string
    AgentEvaluation:
      type: object
      required: [sessionId, state, completed, toolCalls, toolFailures, unresolvedTools, approvalsRequested, approvalsResolved, checkpoints, compactions, diffs, errors, mutationCalls, protectedMutations, passedChecks, totalChecks, checks]
      properties:
        sessionId:
          type: string
        state:
          type: string
          enum: [starting, idle, running, waiting-approval, stopped, failed]
        completed:
          type: boolean
        toolCalls:
          type: integer
        toolFailures:
          type: integer
        unresolvedTools:
          type: integer
        approvalsRequested:
          type: integer
        approvalsResolved:
          type: integer
        checkpoints:
          type: integer
        compactions:
          type: integer
        diffs:
          type: integer
        errors:
          type: integer
        mutationCalls:
          type: integer
        protectedMutations:
          type: integer
        passedChecks:
          type: integer
        totalChecks:
          type: integer
        checks:
          type: array
          items:
            $ref: "#/components/schemas/AgentEvaluationCheck"
    Entry:
      type: object
      required: [name, path, kind, size, mtime]
      properties:
        name:
          type: string
        path:
          type: string
        kind:
          type: string
          enum: [file, dir, link]
        size:
          type: integer
        mtime:
          type: string
          format: date-time
    Profile:
      type: object
      required: [id, name, host, port, provider, deviceId, createdAt, accessMode, allowedRoots]
      properties:
        id:
          type: string
        name:
          type: string
        host:
          type: string
        port:
          type: integer
        provider:
          type: string
          enum: [do, hetzner, aws, other]
        deviceId:
          type: string
        createdAt:
          type: string
          format: date-time
        defaultWorkspace:
          type: string
          nullable: true
        defaultShell:
          type: string
          enum: [default, bash, zsh, fish]
        terminalPersistence:
          type: boolean
        monitorInterval:
          type: integer
          enum: [2, 5, 10, 30]
        accessMode:
          type: string
          enum: [restricted]
        allowedRoots:
          type: array
          items:
            type: string
    ProfileUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        defaultWorkspace:
          type: string
        defaultShell:
          type: string
          enum: [default, bash, zsh, fish]
        terminalPersistence:
          type: boolean
        monitorInterval:
          type: integer
          enum: [2, 5, 10, 30]
    PairStartRequest:
      type: object
      required: [host, phrase]
      properties:
        host:
          type: string
        port:
          type: integer
          default: 22
        phrase:
          type: string
    PairStartResponse:
      type: object
      required: [profileId, certExpiresAt]
      properties:
        profileId:
          type: string
        certExpiresAt:
          type: string
          format: date-time
    HostKeyInfo:
      type: object
      required: [host, port, algorithm, fingerprint, publicKey, status]
      properties:
        host:
          type: string
        port:
          type: integer
        algorithm:
          type: string
        fingerprint:
          type: string
        publicKey:
          type: string
        status:
          type: string
          enum: [unknown, trusted, changed]
        trustedFingerprint:
          type: [string, "null"]
    HostKeyTrustRequest:
      type: object
      required: [host, port, fingerprint, publicKey]
      properties:
        host:
          type: string
        port:
          type: integer
        fingerprint:
          type: string
        publicKey:
          type: string
    FileListRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
        offset:
          type: integer
          default: 0
        limit:
          type: integer
          default: 500
    FileReadRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
    FileReadResponse:
      type: object
      required: [content, etag]
      properties:
        content:
          type: string
        etag:
          type: string
        truncated:
          type: boolean
          default: false
    FileWriteRequest:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
        content:
          type: string
        etag:
          type: string
          nullable: true
    FileWriteResponse:
      type: object
      required: [etag]
      properties:
        etag:
          type: string
    FileMkdirRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
    FileDeleteRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
    FileRenameRequest:
      type: object
      required: [oldPath, newPath]
      properties:
        oldPath:
          type: string
        newPath:
          type: string
    BugReportRequest:
      type: object
      required: [categories, description, includeDiagnostics]
      properties:
        categories:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
            enum: [editor, terminal, connection, files, agent, other]
        description:
          type: string
          minLength: 10
          maxLength: 4000
        includeDiagnostics:
          type: boolean
    BugReportResponse:
      type: object
      required: [reportId, createdAt, storedLocally]
      properties:
        reportId:
          type: string
        createdAt:
          type: string
          format: date-time
        storedLocally:
          type: boolean
    DashboardResource:
      type: object
      required: [usedBytes, totalBytes, pct]
      properties:
        usedBytes: { type: integer }
        totalBytes: { type: integer }
        pct: { type: number }
    ServerDashboard:
      type: object
      required: [capturedAt, cpuPct, load1m, memory, disk, upBps, downBps, processes, services, ports, logs]
      properties:
        capturedAt: { type: string, format: date-time }
        cpuPct: { type: number }
        load1m: { type: number }
        memory: { $ref: "#/components/schemas/DashboardResource" }
        disk: { $ref: "#/components/schemas/DashboardResource" }
        upBps: { type: integer }
        downBps: { type: integer }
        processes: { type: array, items: { type: object } }
        services: { type: array, items: { type: object } }
        ports: { type: array, items: { type: object } }
        logs: { type: array, items: { type: object } }
    ServerSettings:
      type: object
      required: [profileId, authenticationMethod, hostKeyStatus, hostname, operatingSystem, architecture, kernel, uptimeSeconds]
      properties:
        profileId: { type: string }
        authenticationMethod:
          type: string
          enum: [password, private-key, certificate, ssh-agent]
        hostKeyStatus:
          type: string
          enum: [trusted, unknown]
        hostKeyAlgorithm: { type: string, nullable: true }
        hostKeyFingerprint: { type: string, nullable: true }
        hostname: { type: string }
        operatingSystem: { type: string }
        architecture: { type: string }
        kernel: { type: string }
        uptimeSeconds: { type: integer }
    AuthorizedKey:
      type: object
      required: [id, algorithm, fingerprint, comment]
      properties:
        id: { type: string }
        algorithm: { type: string }
        fingerprint: { type: string }
        comment: { type: string }
paths:
  /api/health:
    get:
      operationId: health
      responses:
        "200":
          description: Service health.
  /api/reports:
    post:
      operationId: reportsCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BugReportRequest"
      responses:
        "200":
          description: Report saved securely on the local device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BugReportResponse"
  /api/profiles:
    get:
      operationId: profilesList
      responses:
        "200":
          description: Saved connection profiles.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
  /api/profiles/{profileId}:
    parameters:
      - in: path
        name: profileId
        required: true
        schema:
          type: string
    patch:
      operationId: profilesUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
      responses:
        "200":
          description: Updated connection profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    delete:
      operationId: profilesDelete
      responses:
        "200":
          description: Connection profile deleted.
  /api/pair/start:
    post:
      operationId: pairStart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairStartRequest"
      responses:
        "200":
          description: Pairing started and profile created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairStartResponse"
  /api/pair/start-cert:
    post:
      operationId: pairStartCert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairStartRequest"
      responses:
        "200":
          description: Dev-only certificate profile created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairStartResponse"
  /api/conn/connect:
    post:
      operationId: connConnect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profileId]
              properties:
                profileId:
                  type: string
      responses:
        "200":
          description: Connected.
  /api/conn/stats:
    get:
      operationId: connStats
      responses:
        "200":
          description: Current telemetry.
          content:
            application/json:
                schema:
